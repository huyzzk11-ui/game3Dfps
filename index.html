<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Supercar Simulator - Police Chase (Optimized)</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000;
    }
    #info {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      border-left: 4px solid #ff00cc;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 0 20px rgba(255, 0, 204, 0.4);
    }
    #info h1 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 1px;
    }
    #info span { color: #ff00cc; font-weight: 700; }
    #info .wanted { color: #ff3333; font-weight: 700; }

    #speed {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 12px 24px;
      border-radius: 50px;
      backdrop-filter: blur(8px);
      border-bottom: 3px solid #ff00cc;
      font-size: 1.8rem;
      font-weight: 700;
      font-family: monospace;
      z-index: 100;
      box-shadow: 0 0 30px rgba(255, 0, 204, 0.3);
    }
    #speed small { font-size: 0.9rem; color: #aaa; margin-left: 5px; }

    #controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.65);
      color: #ccc;
      padding: 12px 20px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      font-size: 0.8rem;
      border: 1px solid rgba(255, 0, 204, 0.3);
      z-index: 100;
      text-align: right;
    }
    #controls kbd {
      background: #333;
      border-radius: 4px;
      padding: 2px 6px;
      margin: 0 3px;
      color: #ff00cc;
      font-weight: 600;
      border: 1px solid #ff00cc;
    }

    #weather {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.8rem;
      z-index: 100;
      border: 1px solid rgba(0,255,255,0.3);
      backdrop-filter: blur(8px);
    }
    #weather span { color: #00ffff; font-weight: 600; }

    #policeAlert {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 0, 0, 0.85);
      color: #fff;
      padding: 10px 30px;
      border-radius: 8px;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 3px;
      z-index: 100;
      box-shadow: 0 0 40px rgba(255, 0, 0, 0.8);
      display: none;
      animation: pulse 0.8s infinite;
      pointer-events: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.7; transform: translateX(-50%) scale(1.05); }
    }

    /* Graphics settings panel */
    #settingsToggle {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: #00ffff;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      cursor: pointer;
      z-index: 101;
      border: 1px solid rgba(0,255,255,0.5);
      backdrop-filter: blur(8px);
      user-select: none;
      transition: all 0.2s;
    }
    #settingsToggle:hover {
      background: rgba(0,255,255,0.2);
    }
    #settingsPanel {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid rgba(0,255,255,0.3);
      backdrop-filter: blur(12px);
      z-index: 102;
      width: 280px;
      display: none;
      box-shadow: 0 0 40px rgba(0,255,255,0.2);
    }
    #settingsPanel h3 {
      margin: 0 0 15px 0;
      color: #00ffff;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 2px;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }
    .setting-row select, .setting-row input {
      background: #222;
      color: #fff;
      border: 1px solid #00ffff;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.8rem;
      width: 130px;
    }
    .setting-row input[type="checkbox"] {
      width: auto;
      accent-color: #00ffff;
    }
    #fps {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: #0f0;
      padding: 6px 14px;
      border-radius: 20px;
      font-family: monospace;
      font-size: 0.75rem;
      z-index: 100;
    }

    #errorOverlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      color: #ff3333;
      display: none;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      font-size: 16px;
      padding: 40px;
      z-index: 9999;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="info">
    <h1>🏎️ <span>SUPERCAR</span> CHASE · <span class="wanted" id="wantedStars">☆☆☆☆☆</span></h1>
  </div>
  <div id="speed">0 <small>km/h</small></div>
  <div id="weather">Thời tiết: <span id="weatherName">🌙 Đêm</span></div>
  <div id="controls">
    <kbd>W</kbd> <kbd>↑</kbd> · <kbd>S</kbd> <kbd>↓</kbd> · <kbd>A</kbd> <kbd>←</kbd> · <kbd>D</kbd> <kbd>→</kbd> · <kbd>Space</kbd> Phanh
  </div>
  <div id="policeAlert">⚠️ CẢNH SÁT ĐANG ĐUỔI ⚠️</div>
  <div id="settingsToggle">⚙️ CÀI ĐẶT ĐỒ HỌA</div>
  <div id="settingsPanel">
    <h3>⚙️ CÀI ĐẶT</h3>
    <div class="setting-row">
      <label>Chất lượng đồ họa</label>
      <select id="qualitySelect">
        <option value="low">Thấp (Lag-free)</option>
        <option value="medium" selected>Trung bình</option>
        <option value="high">Cao</option>
      </select>
    </div>
    <div class="setting-row">
      <label>Bóng đổ</label>
      <input type="checkbox" id="shadowToggle" checked>
    </div>
    <div class="setting-row">
      <label>Pixel Ratio</label>
      <select id="pixelRatioSelect">
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
    </div>
    <div class="setting-row">
      <label>Tầm nhìn</label>
      <select id="viewDistSelect">
        <option value="3">Gần</option>
        <option value="4" selected>Trung bình</option>
        <option value="5">Xa</option>
      </select>
    </div>
    <div class="setting-row">
      <label>Độ khó cảnh sát</label>
      <select id="difficultySelect">
        <option value="easy">Dễ</option>
        <option value="normal" selected>Bình thường</option>
        <option value="hard">Khó</option>
        <option value="insane">Điên cuồng</option>
      </select>
    </div>
  </div>
  <div id="fps">FPS: --</div>
  <div id="errorOverlay"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    window.addEventListener('error', (e) => {
      const overlay = document.getElementById('errorOverlay');
      overlay.style.display = 'flex';
      overlay.textContent = '❌ LỖI: ' + e.message + '\n\n' + (e.error ? e.error.stack : '');
      console.error(e.error || e.message);
    });

    import * as THREE from 'three';

    try {
      // ============================================================
      // GRAPHICS SETTINGS
      // ============================================================
      const settings = {
        quality: 'medium',
        shadows: true,
        pixelRatio: 1,
        viewRadius: 4,
        difficulty: 'normal'
      };

      const difficultyConfig = {
        easy:    { maxPolice: 3, spawnInterval: 10, policeSpeedBase: 20, policeSpeedPerWanted: 2, aggression: 1.5 },
        normal:  { maxPolice: 4, spawnInterval: 7,  policeSpeedBase: 26, policeSpeedPerWanted: 3, aggression: 2.2 },
        hard:    { maxPolice: 6, spawnInterval: 5,  policeSpeedBase: 32, policeSpeedPerWanted: 4, aggression: 3.0 },
        insane:  { maxPolice: 8, spawnInterval: 3,  policeSpeedBase: 38, policeSpeedPerWanted: 5, aggression: 4.0 }
      };

      // ============================================================
      // CONFIG
      // ============================================================
      const CELL_SIZE = 60;
      const ROAD_WIDTH = 10;
      const CAMERA_DISTANCE = 16;
      const CAMERA_HEIGHT = 7.5;
      const CAMERA_LERP = 0.1;
      const LOOK_AT_HEIGHT = 2.5;
      const MAX_SPEED = 160;

      // ============================================================
      // SCENE
      // ============================================================
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a1a);
      scene.fog = new THREE.FogExp2(0x0a0a1a, 0.003);

      const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 2500);
      camera.position.set(0, CAMERA_HEIGHT, CAMERA_DISTANCE);
      camera.lookAt(0, LOOK_AT_HEIGHT, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.BasicShadowMap;
      renderer.setPixelRatio(1);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      document.body.appendChild(renderer.domElement);

      // ============================================================
      // LIGHTING (minimal)
      // ============================================================
      const ambientLight = new THREE.AmbientLight(0x404060);
      scene.add(ambientLight);

      const moonLight = new THREE.DirectionalLight(0x8899ff, 0.8);
      moonLight.position.set(50, 100, 30);
      moonLight.castShadow = true;
      moonLight.shadow.mapSize.width = 512;
      moonLight.shadow.mapSize.height = 512;
      moonLight.shadow.camera.left = -60;
      moonLight.shadow.camera.right = 60;
      moonLight.shadow.camera.top = 60;
      moonLight.shadow.camera.bottom = -60;
      moonLight.shadow.camera.near = 1;
      moonLight.shadow.camera.far = 200;
      scene.add(moonLight);

      // Rim lights for supercar showcase (follows car)
      const rimLight1 = new THREE.PointLight(0xff00cc, 2.5, 25);
      rimLight1.position.set(-5, 3, -5);
      scene.add(rimLight1);

      const rimLight2 = new THREE.PointLight(0x00ffff, 2.5, 25);
      rimLight2.position.set(5, 3, -5);
      scene.add(rimLight2);

      // ============================================================
      // CAR (low-poly optimized but still detailed)
      // ============================================================
      const carGroup = new THREE.Group();
      scene.add(carGroup);

      const bodyMat = new THREE.MeshPhysicalMaterial({
        color: 0xdd0022, roughness: 0.15, metalness: 0.9,
        clearcoat: 1.0, clearcoatRoughness: 0.05,
        emissive: new THREE.Color(0x220000), emissiveIntensity: 0.4
      });
      const darkMat = new THREE.MeshPhysicalMaterial({ color: 0x0a0a0a, roughness: 0.3, metalness: 0.8, clearcoat: 0.8 });
      const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x1a1a2e, transparent: true, opacity: 0.6, roughness: 0.05, metalness: 0.1, clearcoat: 1.0 });

      // Body parts
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.6, 4.6), bodyMat);
      body.position.y = 0.7; body.castShadow = true; body.receiveShadow = true;
      carGroup.add(body);

      const hood = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.15, 1.6), bodyMat);
      hood.position.set(0, 1.05, 1.3); hood.castShadow = true;
      carGroup.add(hood);

      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.55, 1.9), glassMat);
      cabin.position.set(0, 1.3, -0.2); cabin.castShadow = true;
      carGroup.add(cabin);

      const roof = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.08, 1.6), darkMat);
      roof.position.set(0, 1.6, -0.2); roof.castShadow = true;
      carGroup.add(roof);

      // Neon skirts
      const skirtMat = new THREE.MeshPhysicalMaterial({
        color: 0x00ffff, emissive: new THREE.Color(0x00ffff), emissiveIntensity: 2.5,
        roughness: 0.2, metalness: 0.1, transparent: true, opacity: 0.9
      });
      const skirtL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 3.8), skirtMat);
      skirtL.position.set(-1.08, 0.35, 0);
      carGroup.add(skirtL);
      const skirtR = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 3.8), skirtMat.clone());
      skirtR.position.set(1.08, 0.35, 0);
      carGroup.add(skirtR);

      const neonFront = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.06, 0.1), skirtMat.clone());
      neonFront.position.set(0, 0.25, 2.2);
      carGroup.add(neonFront);
      const neonRear = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.06, 0.1), skirtMat.clone());
      neonRear.position.set(0, 0.25, -2.2);
      carGroup.add(neonRear);

      // Wheels (shared geometry & material = 4 draw calls)
      const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.35, 16);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
      const rimGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.36, 8);
      const rimMatShared = new THREE.MeshPhysicalMaterial({
        color: 0x222222, emissive: new THREE.Color(0x00aaff), emissiveIntensity: 0.6,
        metalness: 0.95, roughness: 0.1
      });

      const wheelPositions = [
        { x: -1.05, z: 1.45 }, { x: 1.05, z: 1.45 },
        { x: -1.05, z: -1.45 }, { x: 1.05, z: -1.45 }
      ];
      const wheels = [];
      wheelPositions.forEach(pos => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(pos.x, 0.42, pos.z);
        wheel.castShadow = true;
        carGroup.add(wheel);
        const rim = new THREE.Mesh(rimGeo, rimMatShared);
        rim.rotation.z = Math.PI / 2;
        rim.position.set(pos.x, 0.42, pos.z);
        carGroup.add(rim);
        wheels.push(wheel);
      });

      // Headlights
      const headlightMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, emissive: new THREE.Color(0x88ccff), emissiveIntensity: 3, roughness: 0.1 });
      const headlightGeo = new THREE.BoxGeometry(0.35, 0.08, 0.08);
      const headlightL = new THREE.Mesh(headlightGeo, headlightMat);
      headlightL.position.set(-0.65, 1.0, 2.25);
      carGroup.add(headlightL);
      const headlightR = new THREE.Mesh(headlightGeo, headlightMat.clone());
      headlightR.position.set(0.65, 1.0, 2.25);
      carGroup.add(headlightR);

      const headlightBeam = new THREE.SpotLight(0xaaddff, 3, 50, Math.PI / 6, 0.5, 1.5);
      headlightBeam.position.set(0, 1, 2.2);
      headlightBeam.target.position.set(0, 0, 20);
      carGroup.add(headlightBeam);
      carGroup.add(headlightBeam.target);

      // Taillight
      const tailMat = new THREE.MeshPhysicalMaterial({ color: 0xff0033, emissive: new THREE.Color(0xff0033), emissiveIntensity: 3, roughness: 0.2 });
      const taillight = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.08, 0.06), tailMat);
      taillight.position.set(0, 0.95, -2.3);
      carGroup.add(taillight);
      const tailLightGlow = new THREE.PointLight(0xff0033, 2, 12);
      tailLightGlow.position.set(0, 1, -2.5);
      carGroup.add(tailLightGlow);

      // Spoiler
      const spoilerMat = new THREE.MeshPhysicalMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.6, clearcoat: 1.0 });
      const spoiler = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.06, 0.4), spoilerMat);
      spoiler.position.set(0, 1.35, -2.1);
      carGroup.add(spoiler);

      // Underbody glow
      const underGlow = new THREE.PointLight(0x00ffff, 3, 8);
      underGlow.position.set(0, 0.1, 0);
      carGroup.add(underGlow);

      // ============================================================
      // WEATHER
      // ============================================================
      const weatherStates = [
        { name: '☀️ Nắng', bg: 0x87CEEB, fog: 0x87CEEB, fogDensity: 0.0015, ambient: 0x707090, sunColor: 0xfff5e6, sunIntensity: 1.2, particles: 0 },
        { name: '🌧️ Mưa', bg: 0x4a5a6a, fog: 0x4a5a6a, fogDensity: 0.008, ambient: 0x404050, sunColor: 0x8899aa, sunIntensity: 0.4, particles: 800 },
        { name: '🌫️ Sương mù', bg: 0x8a8a9a, fog: 0x9a9aaa, fogDensity: 0.025, ambient: 0x606070, sunColor: 0xaaaacc, sunIntensity: 0.5, particles: 0 },
        { name: '🌙 Đêm', bg: 0x0a0a1a, fog: 0x0a0a1a, fogDensity: 0.003, ambient: 0x303040, sunColor: 0x4455aa, sunIntensity: 0.4, particles: 0 }
      ];
      let currentWeatherIndex = 3;
      let rainParticles = null;
      let weatherTimer = 0;
      let weatherChangeInterval = 25;

      function applyWeather(index) {
        const w = weatherStates[index];
        scene.background = new THREE.Color(w.bg);
        scene.fog = new THREE.FogExp2(w.fog, w.fogDensity);
        ambientLight.color = new THREE.Color(w.ambient);
        moonLight.color = new THREE.Color(w.sunColor);
        moonLight.intensity = w.sunIntensity;

        if (rainParticles) {
          scene.remove(rainParticles);
          rainParticles.geometry.dispose();
          rainParticles.material.dispose();
          rainParticles = null;
        }

        if (w.particles > 0) {
          const geo = new THREE.BufferGeometry();
          const positions = new Float32Array(w.particles * 3);
          for (let i = 0; i < w.particles; i++) {
            positions[i*3] = (Math.random() - 0.5) * 80;
            positions[i*3+1] = Math.random() * 30;
            positions[i*3+2] = (Math.random() - 0.5) * 80;
          }
          geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          const mat = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.15, transparent: true, opacity: 0.6 });
          rainParticles = new THREE.Points(geo, mat);
          scene.add(rainParticles);
        }

        document.getElementById('weatherName').textContent = w.name;
      }

      function cycleWeather() {
        currentWeatherIndex = (currentWeatherIndex + 1) % weatherStates.length;
        applyWeather(currentWeatherIndex);
      }

      applyWeather(currentWeatherIndex);

      // ============================================================
      // TERRAIN (NO SCENERY, only road + ground = 3 draw calls per chunk)
      // ============================================================
      const chunkMap = new Map();

      function createGroundTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#2e4a2a';
        ctx.fillRect(0, 0, 64, 64);
        for (let i = 0; i < 200; i++) {
          ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.2})`;
          ctx.fillRect(Math.random() * 64, Math.random() * 64, 2, 2);
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(4, 4);
        return tex;
      }

      function createRoadTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 64;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#252525';
        ctx.fillRect(0, 0, 64, 128);
        for (let i = 0; i < 500; i++) {
          ctx.fillStyle = `rgba(120,120,120,${Math.random() * 0.3})`;
          ctx.fillRect(Math.random() * 64, Math.random() * 128, 1, 1);
        }
        // Yellow center dashes
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(28, 0, 8, 32);
        ctx.fillRect(28, 64, 8, 32);
        // White edges
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(6, 0, 3, 128);
        ctx.fillRect(55, 0, 3, 128);
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(1, 2);
        return tex;
      }

      const groundTex = createGroundTexture();
      const roadTex = createRoadTexture();

      // Shared materials across ALL chunks (massive draw call reduction)
      const groundMatShared = new THREE.MeshStandardMaterial({ map: groundTex, color: 0x4a6a3a, roughness: 0.9 });
      const roadMatShared = new THREE.MeshStandardMaterial({ map: roadTex, color: 0x999999, roughness: 0.8 });
      const groundGeoShared = new THREE.PlaneGeometry(CELL_SIZE, CELL_SIZE);
      const roadZGeoShared = new THREE.PlaneGeometry(ROAD_WIDTH, CELL_SIZE);
      const roadXGeoShared = new THREE.PlaneGeometry(CELL_SIZE, ROAD_WIDTH);

      function createChunk(chunkX, chunkZ) {
        const key = `${chunkX},${chunkZ}`;
        if (chunkMap.has(key)) return chunkMap.get(key);

        const chunkGroup = new THREE.Group();

        const ground = new THREE.Mesh(groundGeoShared, groundMatShared);
        ground.rotation.x = -Math.PI / 2;
        ground.position.set(chunkX * CELL_SIZE, 0, chunkZ * CELL_SIZE);
        ground.receiveShadow = true;
        chunkGroup.add(ground);

        const roadZ = new THREE.Mesh(roadZGeoShared, roadMatShared);
        roadZ.rotation.x = -Math.PI / 2;
        roadZ.position.set(chunkX * CELL_SIZE, 0.02, chunkZ * CELL_SIZE + CELL_SIZE / 2);
        roadZ.receiveShadow = true;
        chunkGroup.add(roadZ);

        const roadX = new THREE.Mesh(roadXGeoShared, roadMatShared);
        roadX.rotation.x = -Math.PI / 2;
        roadX.position.set(chunkX * CELL_SIZE + CELL_SIZE / 2, 0.02, chunkZ * CELL_SIZE);
        roadX.receiveShadow = true;
        chunkGroup.add(roadX);

        chunkMap.set(key, chunkGroup);
        scene.add(chunkGroup);
        return chunkGroup;
      }

      function loadChunksAroundCar() {
        const carChunkX = Math.round(carGroup.position.x / CELL_SIZE);
        const carChunkZ = Math.round(carGroup.position.z / CELL_SIZE);
        const radius = settings.viewRadius;

        const neededKeys = new Set();
        for (let dx = -radius; dx <= radius; dx++) {
          for (let dz = -radius; dz <= radius; dz++) {
            const cx = carChunkX + dx;
            const cz = carChunkZ + dz;
            const key = `${cx},${cz}`;
            neededKeys.add(key);
            if (!chunkMap.has(key)) createChunk(cx, cz);
          }
        }

        for (const [key, chunk] of chunkMap.entries()) {
          if (!neededKeys.has(key)) {
            scene.remove(chunk);
            chunkMap.delete(key);
          }
        }
      }

      loadChunksAroundCar();

      // ============================================================
      // POLICE BOTS (optimized with shared materials)
      // ============================================================
      const policeBots = [];
      let policeSpawnTimer = 0;
      let wantedLevel = 0;

      // Shared police geometries & materials
      const policeBodyGeo = new THREE.BoxGeometry(2.1, 0.7, 4.4);
      const policeBodyMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.7 });
      const policeDoorGeo = new THREE.BoxGeometry(0.05, 0.5, 2);
      const policeDoorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.5 });
      const policeCabinGeo = new THREE.BoxGeometry(1.6, 0.6, 2.0);
      const policeCabinMat = new THREE.MeshStandardMaterial({ color: 0x223344, transparent: true, opacity: 0.7, metalness: 0.9 });
      const policeNeonGeo = new THREE.BoxGeometry(0.06, 0.06, 3.8);
      const policeNeonMat = new THREE.MeshStandardMaterial({ color: 0x0000ff, emissive: new THREE.Color(0x0000ff), emissiveIntensity: 3, transparent: true, opacity: 0.9 });
      const policeWheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 8);
      const policeWheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
      const policeLightBarGeo = new THREE.BoxGeometry(1.2, 0.1, 0.3);
      const policeLightBarMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
      const policeRedGeo = new THREE.BoxGeometry(0.5, 0.12, 0.25);
      const policeBlueGeo = new THREE.BoxGeometry(0.5, 0.12, 0.25);

      function createPoliceCar() {
        const group = new THREE.Group();

        const body = new THREE.Mesh(policeBodyGeo, policeBodyMat);
        body.position.y = 0.7; body.castShadow = true;
        group.add(body);

        const doorL = new THREE.Mesh(policeDoorGeo, policeDoorMat);
        doorL.position.set(-1.06, 0.8, 0);
        group.add(doorL);
        const doorR = new THREE.Mesh(policeDoorGeo, policeDoorMat);
        doorR.position.set(1.06, 0.8, 0);
        group.add(doorR);

        const cabin = new THREE.Mesh(policeCabinGeo, policeCabinMat);
        cabin.position.set(0, 1.35, -0.2);
        group.add(cabin);

        const neonL = new THREE.Mesh(policeNeonGeo, policeNeonMat);
        neonL.position.set(-1.03, 0.4, 0);
        group.add(neonL);
        const neonR = new THREE.Mesh(policeNeonGeo, policeNeonMat);
        neonR.position.set(1.03, 0.4, 0);
        group.add(neonR);

        const lightBarBase = new THREE.Mesh(policeLightBarGeo, policeLightBarMat);
        lightBarBase.position.set(0, 1.7, -0.3);
        group.add(lightBarBase);

        // Unique materials per police car for siren flashing (only these need independence)
        const redMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: new THREE.Color(0xff0000), emissiveIntensity: 2 });
        const blueMat = new THREE.MeshStandardMaterial({ color: 0x0066ff, emissive: new THREE.Color(0x0066ff), emissiveIntensity: 2 });

        const redLight = new THREE.Mesh(policeRedGeo, redMat);
        redLight.position.set(-0.3, 1.75, -0.3);
        group.add(redLight);
        const blueLight = new THREE.Mesh(policeBlueGeo, blueMat);
        blueLight.position.set(0.3, 1.75, -0.3);
        group.add(blueLight);

        const sirenRed = new THREE.PointLight(0xff0000, 2, 12);
        sirenRed.position.set(-0.3, 2, -0.3);
        group.add(sirenRed);
        const sirenBlue = new THREE.PointLight(0x0066ff, 2, 12);
        sirenBlue.position.set(0.3, 2, -0.3);
        group.add(sirenBlue);

        const wheelPositions = [
          { x: -1.0, z: 1.4 }, { x: 1.0, z: 1.4 },
          { x: -1.0, z: -1.4 }, { x: 1.0, z: -1.4 }
        ];
        wheelPositions.forEach(pos => {
          const wheel = new THREE.Mesh(policeWheelGeo, policeWheelMat);
          wheel.rotation.z = Math.PI / 2;
          wheel.position.set(pos.x, 0.4, pos.z);
          group.add(wheel);
        });

        group.userData = { sirenRed, sirenBlue, redMat, blueMat, speed: 0, sirenPhase: Math.random() * 10 };
        return group;
      }

      function spawnPolice() {
        const cfg = difficultyConfig[settings.difficulty];
        if (policeBots.length >= cfg.maxPolice) return;

        const police = createPoliceCar();
        const angle = carGroup.rotation.y + (Math.random() - 0.5) * 1.2;
        const dist = 70 + Math.random() * 40;
        police.position.set(
          carGroup.position.x - Math.sin(angle) * dist,
          0,
          carGroup.position.z - Math.cos(angle) * dist
        );
        police.rotation.y = angle;
        scene.add(police);
        policeBots.push(police);
        wantedLevel = Math.min(5, policeBots.length);
        updateWantedUI();
      }

      function updateWantedUI() {
        const stars = '★'.repeat(wantedLevel) + '☆'.repeat(5 - wantedLevel);
        document.getElementById('wantedStars').textContent = stars;
        document.getElementById('policeAlert').style.display = policeBots.length > 0 ? 'block' : 'none';
      }

      function updatePolice(delta) {
        const cfg = difficultyConfig[settings.difficulty];
        policeSpawnTimer += delta;
        if (policeSpawnTimer > cfg.spawnInterval) {
          policeSpawnTimer = 0;
          spawnPolice();
        }

        for (let i = policeBots.length - 1; i >= 0; i--) {
          const police = policeBots[i];
          const data = police.userData;

          const dx = carGroup.position.x - police.position.x;
          const dz = carGroup.position.z - police.position.z;
          const dist = Math.sqrt(dx * dx + dz * dz);

          data.sirenPhase += delta * 10;
          const flash = Math.sin(data.sirenPhase) > 0;
          data.redMat.emissiveIntensity = flash ? 3 : 0.2;
          data.blueMat.emissiveIntensity = flash ? 0.2 : 3;
          data.sirenRed.intensity = flash ? 3 : 0.3;
          data.sirenBlue.intensity = flash ? 0.3 : 3;

          if (dist > 4) {
            const targetAngle = Math.atan2(dx, dz);
            let angleDiff = targetAngle - police.rotation.y;
            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
            police.rotation.y += angleDiff * Math.min(1, delta * cfg.aggression);

            const policeSpeed = cfg.policeSpeedBase + wantedLevel * cfg.policeSpeedPerWanted;
            data.speed = Math.min(data.speed + delta * 20, policeSpeed);

            police.position.x += Math.sin(police.rotation.y) * data.speed * delta;
            police.position.z += Math.cos(police.rotation.y) * data.speed * delta;
          } else {
            data.speed *= 0.9;
          }

          if (dist > 280) {
            scene.remove(police);
            policeBots.splice(i, 1);
            wantedLevel = Math.min(5, policeBots.length);
            updateWantedUI();
          }
        }
      }

      // ============================================================
      // CAMERA
      // ============================================================
      const _camTargetPos = new THREE.Vector3();
      const _camLookAt = new THREE.Vector3();
      const _carPos = new THREE.Vector3();
      let camCurrentPos = new THREE.Vector3(0, CAMERA_HEIGHT, CAMERA_DISTANCE);
      let camCurrentLookAt = new THREE.Vector3(0, LOOK_AT_HEIGHT, 0);

      camera.position.copy(camCurrentPos);
      camera.lookAt(camCurrentLookAt);

      function updateCamera(delta) {
        carGroup.getWorldPosition(_carPos);
        const carAngle = carGroup.rotation.y;
        const forwardX = Math.sin(carAngle);
        const forwardZ = Math.cos(carAngle);

        _camTargetPos.set(
          _carPos.x - forwardX * CAMERA_DISTANCE,
          _carPos.y + CAMERA_HEIGHT,
          _carPos.z - forwardZ * CAMERA_DISTANCE
        );

        _camLookAt.set(
          _carPos.x + forwardX * 4.0,
          _carPos.y + LOOK_AT_HEIGHT,
          _carPos.z + forwardZ * 4.0
        );

        const lerpFactor = 1 - Math.pow(1 - CAMERA_LERP, delta * 60);
        camCurrentPos.lerp(_camTargetPos, Math.min(lerpFactor, 1));
        camCurrentLookAt.lerp(_camLookAt, Math.min(lerpFactor * 1.5, 1));

        camera.position.copy(camCurrentPos);
        camera.lookAt(camCurrentLookAt);
      }

      // ============================================================
      // CONTROLS
      // ============================================================
      const carState = {
        speed: 0,
        maxSpeed: MAX_SPEED,
        acceleration: 0.7,
        deceleration: 0.3,
        brakeDeceleration: 2.5,
        turnSpeed: 0.035
      };

      const keys = {
        w: false, a: false, s: false, d: false, space: false,
        arrowup: false, arrowdown: false, arrowleft: false, arrowright: false
      };

      window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === ' ' || key === 'space') { keys.space = true; e.preventDefault(); }
        else if (key in keys) { keys[key] = true; e.preventDefault(); }
        if (e.key === 'ArrowUp') { keys.arrowup = true; e.preventDefault(); }
        if (e.key === 'ArrowDown') { keys.arrowdown = true; e.preventDefault(); }
        if (e.key === 'ArrowLeft') { keys.arrowleft = true; e.preventDefault(); }
        if (e.key === 'ArrowRight') { keys.arrowright = true; e.preventDefault(); }
      });

      window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (key === ' ' || key === 'space') { keys.space = false; e.preventDefault(); }
        else if (key in keys) { keys[key] = false; e.preventDefault(); }
        if (e.key === 'ArrowUp') { keys.arrowup = false; e.preventDefault(); }
        if (e.key === 'ArrowDown') { keys.arrowdown = false; e.preventDefault(); }
        if (e.key === 'ArrowLeft') { keys.arrowleft = false; e.preventDefault(); }
        if (e.key === 'ArrowRight') { keys.arrowright = false; e.preventDefault(); }
      });

      function updateCar(delta) {
        const forward = keys.w || keys.arrowup;
        const backward = keys.s || keys.arrowdown;
        const left = keys.a || keys.arrowleft;
        const right = keys.d || keys.arrowright;
        const brake = keys.space;

        if (forward && !brake) {
          carState.speed += carState.acceleration * delta * 60;
        } else if (backward && !brake) {
          carState.speed -= carState.acceleration * delta * 60;
        } else if (brake) {
          if (carState.speed > 0) {
            carState.speed -= carState.brakeDeceleration * delta * 60;
            if (carState.speed < 0) carState.speed = 0;
          } else if (carState.speed < 0) {
            carState.speed += carState.brakeDeceleration * delta * 60;
            if (carState.speed > 0) carState.speed = 0;
          }
        } else {
          if (carState.speed > 0) {
            carState.speed -= carState.deceleration * delta * 60;
            if (carState.speed < 0) carState.speed = 0;
          } else if (carState.speed < 0) {
            carState.speed += carState.deceleration * delta * 60;
            if (carState.speed > 0) carState.speed = 0;
          }
        }

        carState.speed = Math.max(-50, Math.min(carState.maxSpeed, carState.speed));

        if (Math.abs(carState.speed) > 0.5) {
          const speedFactor = Math.min(Math.abs(carState.speed) / 40, 1.0);
          const turnAmount = carState.turnSpeed * delta * 60 * speedFactor;
          if (left) carGroup.rotation.y += turnAmount * (carState.speed > 0 ? 1 : -1);
          if (right) carGroup.rotation.y -= turnAmount * (carState.speed > 0 ? 1 : -1);
        }

        const moveDelta = carState.speed * delta * 0.22;
        const angle = carGroup.rotation.y;
        carGroup.position.x += Math.sin(angle) * moveDelta;
        carGroup.position.z += Math.cos(angle) * moveDelta;

        const speedKmh = Math.abs(Math.round(carState.speed * 1.2));
        document.getElementById('speed').innerHTML = `${speedKmh} <small>km/h</small>`;

        rimLight1.position.set(
          carGroup.position.x - Math.cos(angle) * 5, 3,
          carGroup.position.z + Math.sin(angle) * 5
        );
        rimLight2.position.set(
          carGroup.position.x + Math.cos(angle) * 5, 3,
          carGroup.position.z - Math.sin(angle) * 5
        );

        loadChunksAroundCar();
      }

      // ============================================================
      // FPS COUNTER
      // ============================================================
      let fpsFrames = 0;
      let fpsTime = 0;
      const fpsEl = document.getElementById('fps');

      // ============================================================
      // SETTINGS UI
      // ============================================================
      const settingsToggle = document.getElementById('settingsToggle');
      const settingsPanel = document.getElementById('settingsPanel');
      settingsToggle.addEventListener('click', () => {
        settingsPanel.style.display = settingsPanel.style.display === 'block' ? 'none' : 'block';
      });

      document.getElementById('qualitySelect').addEventListener('change', (e) => {
        settings.quality = e.target.value;
        if (settings.quality === 'low') {
          renderer.setPixelRatio(0.75);
          renderer.shadowMap.enabled = false;
          moonLight.castShadow = false;
        } else if (settings.quality === 'medium') {
          renderer.setPixelRatio(1);
          renderer.shadowMap.enabled = true;
          moonLight.castShadow = true;
        } else {
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
          renderer.shadowMap.enabled = true;
          moonLight.castShadow = true;
        }
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      document.getElementById('shadowToggle').addEventListener('change', (e) => {
        settings.shadows = e.target.checked;
        renderer.shadowMap.enabled = settings.shadows;
        moonLight.castShadow = settings.shadows;
      });

      document.getElementById('pixelRatioSelect').addEventListener('change', (e) => {
        settings.pixelRatio = parseFloat(e.target.value);
        renderer.setPixelRatio(settings.pixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      document.getElementById('viewDistSelect').addEventListener('change', (e) => {
        settings.viewRadius = parseInt(e.target.value);
        loadChunksAroundCar();
      });

      document.getElementById('difficultySelect').addEventListener('change', (e) => {
        settings.difficulty = e.target.value;
      });

      // ============================================================
      // MAIN LOOP
      // ============================================================
      const clock = new THREE.Clock();
      let neonTime = 0;

      updateWantedUI();

      function animate() {
        requestAnimationFrame(animate);
        const delta = Math.min(clock.getDelta(), 0.05);

        updateCar(delta);
        updateCamera(delta);
        updatePolice(delta);

        weatherTimer += delta;
        if (weatherTimer > weatherChangeInterval) {
          weatherTimer = 0;
          cycleWeather();
        }

        neonTime += delta * 5;
        const neonPulse = 1.5 + Math.sin(neonTime) * 0.8;
        underGlow.intensity = neonPulse * 1.5;
        skirtL.material.emissiveIntensity = neonPulse * 1.5;
        skirtR.material.emissiveIntensity = neonPulse * 1.5;
        neonFront.material.emissiveIntensity = neonPulse * 1.5;
        neonRear.material.emissiveIntensity = neonPulse * 1.5;
        tailLightGlow.intensity = 1.5 + Math.sin(neonTime * 2) * 0.8;
        headlightBeam.intensity = 2.5 + Math.sin(neonTime * 0.5) * 0.5;

        if (rainParticles) {
          const positions = rainParticles.geometry.attributes.position.array;
          for (let i = 0; i < positions.length; i += 3) {
            positions[i+1] -= delta * 30;
            if (positions[i+1] < 0) {
              positions[i+1] = 30;
              positions[i] = (Math.random() - 0.5) * 80;
              positions[i+2] = (Math.random() - 0.5) * 80;
            }
          }
          rainParticles.geometry.attributes.position.needsUpdate = true;
          rainParticles.position.x = carGroup.position.x;
          rainParticles.position.z = carGroup.position.z;
        }

        wheels.forEach(w => {
          w.rotation.x += carState.speed * delta * 0.05;
        });

        renderer.render(scene, camera);

        // FPS counter
        fpsFrames++;
        fpsTime += delta;
        if (fpsTime >= 0.5) {
          fpsEl.textContent = `FPS: ${Math.round(fpsFrames / fpsTime)}`;
          fpsFrames = 0;
          fpsTime = 0;
        }
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      console.log('✅ Supercar Chase Game Ready!');
    } catch (err) {
      const overlay = document.getElementById('errorOverlay');
      overlay.style.display = 'flex';
      overlay.textContent = '❌ LỖI KHỞI TẠO: ' + err.message + '\n\n' + err.stack;
      console.error(err);
    }
  </script>
</body>
</html>
